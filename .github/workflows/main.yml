name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install numpy matplotlib pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --collect-all matplotlib --collect-all numpy --hidden-import=matplotlib.backends.backend_tkagg a method by Newton.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Newton_exe
          path: dist/*.exe
